# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on

# 256 colors / true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Faster escape time for Neovim
set -sg escape-time 0

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Easier pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes using | and -
bind | split-window -h
bind - split-window -v

# Keep the current path when creating panes/windows
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vi keys in copy mode, more history, tidy numbering, nvim focus events
setw -g mode-keys vi
set -g history-limit 50000
set -g renumber-windows on
set -g focus-events on

# make | and - keep the current directory too
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
